<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 RADAR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green:   #00ff88;
    --green2:  #00cc66;
    --amber:   #ffaa00;
    --red:     #ff3344;
    --bg:      #040d0a;
    --surface: #071410;
    --grid:    rgba(0,255,136,0.08);
    --sweep:   rgba(0,255,136,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  header {
    width: 100%;
    max-width: 900px;
    padding: 18px 24px 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(0,255,136,0.15);
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    letter-spacing: 0.25em;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0,255,136,0.5);
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber);
    display: inline-block;
    margin-right: 8px;
    box-shadow: 0 0 8px var(--amber);
    animation: blink 1.2s infinite;
  }
  #status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #status-dot.error  { background: var(--red);   box-shadow: 0 0 8px var(--red); animation: none; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #status-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: rgba(0,255,136,0.6);
  }

  main {
    width: 100%;
    max-width: 900px;
    padding: 20px 16px;
    display: grid;
    grid-template-columns: 1fr 220px;
    grid-template-rows: auto auto;
    gap: 16px;
  }

  /* ---- RADAR CANVAS ---- */
  #radar-wrap {
    grid-row: 1 / 3;
    position: relative;
    background: var(--surface);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-shadow: inset 0 0 40px rgba(0,255,136,0.03), 0 0 30px rgba(0,255,136,0.04);
  }

  #radar {
    display: block;
    max-width: 100%;
    height: auto;
  }

  /* ---- ENV CARD ---- */
  .card {
    background: var(--surface);
    border: 1px solid rgba(0,255,136,0.15);
    border-radius: 4px;
    padding: 16px 18px;
  }

  .card-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(0,255,136,0.45);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 16px rgba(0,255,136,0.4);
    line-height: 1;
  }

  .card-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: rgba(0,255,136,0.5);
    margin-left: 4px;
  }

  /* ---- SCAN TABLE ---- */
  #scan-info {
    background: var(--surface);
    border: 1px solid rgba(0,255,136,0.15);
    border-radius: 4px;
    padding: 14px 18px;
  }

  #scan-info .card-label { margin-bottom: 10px; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    padding: 4px 0;
    border-bottom: 1px solid rgba(0,255,136,0.07);
    color: rgba(0,255,136,0.75);
  }
  .stat-row span:last-child { color: var(--green); }

  /* ---- CONFIG BAR ---- */
  #config-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.72rem;
    color: rgba(0,255,136,0.45);
    padding: 6px 0;
    border-top: 1px solid rgba(0,255,136,0.1);
    flex-wrap: wrap;
  }

  #config-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  input[type=text] {
    background: var(--surface);
    border: 1px solid rgba(0,255,136,0.25);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 2px;
    width: 140px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--green); }

  input[type=range] {
    accent-color: var(--green);
    width: 80px;
  }

  button#refresh-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 4px 14px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.2s, box-shadow 0.2s;
  }
  button#refresh-btn:hover {
    background: rgba(0,255,136,0.08);
    box-shadow: 0 0 12px rgba(0,255,136,0.2);
  }

  button#download-btn {
    background: transparent;
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 4px 14px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.2s, box-shadow 0.2s;
  }
  button#download-btn:hover {
    background: rgba(0,255,136,0.08);
    box-shadow: 0 0 12px rgba(0,255,136,0.2);
  }

  button#download-csv-btn {
    background: transparent;
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 4px 14px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.2s, box-shadow 0.2s;
  }
  button#download-csv-btn:hover {
    background: rgba(0,255,136,0.08);
    box-shadow: 0 0 12px rgba(0,255,136,0.2);
  }

  @media (max-width: 620px) {
    main { grid-template-columns: 1fr; }
    #radar-wrap { grid-row: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>ESP32 RADAR</h1>
  <div>
    <span id="status-dot"></span>
    <span id="status-label">CONNECTING…</span>
  </div>
</header>

<main>
  <!-- Radar Canvas -->
  <div id="radar-wrap">
    <canvas id="radar" width="480" height="280"></canvas>
  </div>

  <!-- Temperature -->
  <div class="card">
    <div class="card-label">▸ TEMPERATURE</div>
    <div class="card-value" id="temp-val">--<span class="card-unit">°C</span></div>
  </div>

  <!-- Humidity + Stats -->
  <div id="scan-info">
    <div class="card-label">▸ ENVIRONMENT / SCAN</div>
    <div class="stat-row"><span>Humidity</span><span id="hum-val">-- %</span></div>
    <div class="stat-row"><span>Min Dist</span><span id="min-dist">-- cm</span></div>
    <div class="stat-row"><span>Max Dist</span><span id="max-dist">-- cm</span></div>
    <div class="stat-row"><span>Closest Angle</span><span id="min-angle">--°</span></div>
    <div class="stat-row"><span>Points</span><span id="points-n">--</span></div>
    <div class="stat-row"><span>Last Update</span><span id="last-upd">--</span></div>
  </div>

  <!-- Config bar -->
  <div id="config-bar">
    <label>HOST <input type="text" id="esp-host" value="http://192.168.1.100" placeholder="http://ESP32_IP"></label>
    <label>INTERVAL
      <input type="range" id="poll-range" min="1" max="30" value="5">
      <span id="poll-label">5s</span>
    </label>
    <label><input type="checkbox" id="sweep-anim" checked> SWEEP FX</label>
    <button id="download-btn">⇩ DOWNLOAD JSON</button>
    <button id="download-csv-btn">⇩ DOWNLOAD CSV</button>
    <button id="refresh-btn">⟳ REFRESH</button>
  </div>
</main>

<script>
// ── CONFIG ───────────────────────────────────────────────────
let ESP_HOST   = 'http://192.168.1.100';
let POLL_MS    = 5000;
let sweepAnim  = true;
let pollTimer  = null;
let latestEnv  = null;

// ── CANVAS SETUP ─────────────────────────────────────────────
const canvas = document.getElementById('radar');
const ctx    = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Radar centre at bottom-centre, half circle upward
const CX = W / 2;
const CY = H - 14;
const R  = Math.min(W / 2, H) - 20;  // max radius

// Sweep animation state
let sweepAngle = 0;
let rafId = null;

// Last scan data
let scanData = [];

// ── DRAW HELPERS ─────────────────────────────────────────────
const GREEN      = '#00ff88';
const GREEN_DIM  = 'rgba(0,255,136,0.12)';
const GRID_COLOR = 'rgba(0,255,136,0.10)';
const BG_COLOR   = '#071410';

function polar(angleDeg, radius) {
  // 0° = right, 90° = up, 180° = left  (standard servo sweep)
  const rad = (angleDeg * Math.PI) / 180;
  return {
    x: CX - radius * Math.cos(rad),
    y: CY - radius * Math.sin(rad)
  };
}

function drawGrid() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // Range rings
  for (let i = 1; i <= 4; i++) {
    const r = (R * i) / 4;
    ctx.beginPath();
    ctx.arc(CX, CY, r, Math.PI, 0, false); // upper half
    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Range label
    const lx = CX + r + 3;
    ctx.fillStyle = 'rgba(0,255,136,0.3)';
    ctx.font = '9px Share Tech Mono, monospace';
    ctx.fillText((75 * i) + 'cm', lx > W - 30 ? CX - r - 32 : lx, CY - 3);
  }

  // Spoke lines
  for (let a = 0; a <= 180; a += 30) {
    const p = polar(a, R);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Angle label
    const lp = polar(a, R + 12);
    ctx.fillStyle = 'rgba(0,255,136,0.4)';
    ctx.font = '9px Share Tech Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(a + '°', lp.x, lp.y + 3);
  }
  ctx.textAlign = 'left';

  // Baseline
  ctx.beginPath();
  ctx.moveTo(CX - R - 10, CY);
  ctx.lineTo(CX + R + 10, CY);
  ctx.strokeStyle = 'rgba(0,255,136,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawSweepFx(angle) {
  // Fading sweep wedge
  const spread = 12; // degrees
  for (let i = 0; i < spread; i++) {
    const a = angle - i;
    if (a < 0 || a > 180) continue;
    const alpha = (spread - i) / spread * 0.25;
    const p = polar(a, R);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = `rgba(0,255,136,${alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // Bright sweep line
  const ps = polar(angle, R);
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(ps.x, ps.y);
  ctx.strokeStyle = 'rgba(0,255,136,0.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function distColor(d) {
  if (d < 50)  return '#ff3344';
  if (d < 150) return '#ffaa00';
  return '#00ff88';
}

function drawPoints(data) {
  if (!data.length) return;
  const maxDist = 300;

  // Draw filled arc path for a filled map look
  ctx.beginPath();
  let first = true;
  data.forEach(({ angle, dist }) => {
    const r = Math.min(dist / maxDist, 1) * R;
    const p = polar(angle, r);
    if (first) { ctx.moveTo(p.x, p.y); first = false; }
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,255,136,0.04)';
  ctx.fill();

  // Draw each point with color coding
  data.forEach(({ angle, dist }) => {
    const r   = Math.min(dist / maxDist, 1) * R;
    const p   = polar(angle, r);
    const col = distColor(dist);

    // Line from origin
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = col.replace(')', ',0.15)').replace('rgb', 'rgba').replace('#', '');
    // simpler:
    ctx.strokeStyle = 'rgba(0,255,136,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Dot
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur  = 6;
    ctx.fill();
    ctx.shadowBlur  = 0;
  });
}

// ── SWEEP ANIMATION ──────────────────────────────────────────
function animateSweep() {
  drawGrid();
  drawPoints(scanData);
  if (sweepAnim) {
    sweepAngle = (sweepAngle + 1) % 181;
    drawSweepFx(sweepAngle);
  }
  rafId = requestAnimationFrame(animateSweep);
}

// ── DATA FETCHING ─────────────────────────────────────────────
async function fetchScan() {
  const res  = await fetch(`${ESP_HOST}/scan`);
  const data = await res.json(); // [{angle, dist}, ...]
  return data;
}

async function fetchEnv() {
  const res  = await fetch(`${ESP_HOST}/env`);
  const data = await res.json(); // {temp, hum}
  return data;
}

function updateStats(data) {
  const dists = data.map(d => d.dist);
  const minD  = Math.min(...dists);
  const maxD  = Math.max(...dists);
  const minA  = data[dists.indexOf(minD)].angle;

  document.getElementById('min-dist').textContent  = minD + ' cm';
  document.getElementById('max-dist').textContent  = maxD + ' cm';
  document.getElementById('min-angle').textContent = minA + '°';
  document.getElementById('points-n').textContent  = data.length;

  const now = new Date();
  document.getElementById('last-upd').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function downloadVisualizedData() {
  if (!scanData.length) return;

  const dists = scanData.map(d => d.dist);
  const minD = Math.min(...dists);
  const maxD = Math.max(...dists);
  const minA = scanData[dists.indexOf(minD)]?.angle ?? null;

  const payload = {
    exportedAt: new Date().toISOString(),
    sourceHost: ESP_HOST,
    environment: latestEnv,
    summary: {
      points: scanData.length,
      minDistanceCm: minD,
      maxDistanceCm: maxD,
      closestAngleDeg: minA
    },
    scan: scanData
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

  link.href = url;
  link.download = `radar-data-${timestamp}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function escapeCsvValue(value) {
  const text = value === null || value === undefined ? '' : String(value);
  return `"${text.replace(/"/g, '""')}"`;
}

function downloadVisualizedCsv() {
  if (!scanData.length) return;

  const exportedAt = new Date().toISOString();
  const sourceHost = ESP_HOST;
  const temp = latestEnv?.temp ?? '';
  const hum = latestEnv?.hum ?? '';

  const header = [
    'exportedAt',
    'sourceHost',
    'temperatureC',
    'humidityPct',
    'angleDeg',
    'distanceCm'
  ];

  const rows = scanData.map(({ angle, dist }) => [
    exportedAt,
    sourceHost,
    temp,
    hum,
    angle,
    dist
  ]);

  const csv = [header, ...rows]
    .map(row => row.map(escapeCsvValue).join(','))
    .join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

  link.href = url;
  link.download = `radar-data-${timestamp}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function setStatus(state) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = '';
  if (state === 'ok')   { dot.classList.add('online'); label.textContent = 'ONLINE'; }
  if (state === 'wait') { label.textContent = 'POLLING…'; }
  if (state === 'err')  { dot.classList.add('error');  label.textContent = 'OFFLINE'; }
}

async function poll() {
  setStatus('wait');
  try {
    const [scan, env] = await Promise.all([fetchScan(), fetchEnv()]);

    // Update radar data
    scanData = scan;
    latestEnv = env;
    updateStats(scan);

    // Update env
    document.getElementById('temp-val').innerHTML =
      `${env.temp.toFixed(1)}<span class="card-unit">°C</span>`;
    document.getElementById('hum-val').textContent = env.hum.toFixed(0) + ' %';

    setStatus('ok');
  } catch(e) {
    console.warn('Fetch error:', e);
    setStatus('err');
  }
}

// ── CONTROLS ─────────────────────────────────────────────────
document.getElementById('esp-host').addEventListener('change', e => {
  ESP_HOST = e.target.value.trim();
});

document.getElementById('poll-range').addEventListener('input', e => {
  POLL_MS = e.target.value * 1000;
  document.getElementById('poll-label').textContent = e.target.value + 's';
  restartPoll();
});

document.getElementById('sweep-anim').addEventListener('change', e => {
  sweepAnim = e.target.checked;
});

document.getElementById('refresh-btn').addEventListener('click', poll);
document.getElementById('download-btn').addEventListener('click', downloadVisualizedData);
document.getElementById('download-csv-btn').addEventListener('click', downloadVisualizedCsv);

function restartPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, POLL_MS);
}

// ── INIT ──────────────────────────────────────────────────────
drawGrid();
animateSweep();
poll();
restartPoll();
</script>
</body>
</html>
